<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <!-- Evening: "sunset colours", the naval ritual of lowering the ensign
       at day's end, mirroring the morning's flags going up. -->
  <rect x="0" y="0" width="400" height="600" fill="#F5D400"/>

  <!-- low sun, half set behind the hull -->
  <circle cx="200" cy="480" r="92" fill="#E01B24"/>

  <!-- sea -->
  <rect x="0" y="470" width="400" height="130" fill="#E01B24"/>
  <g stroke="#F5D400" stroke-width="7" stroke-linecap="round">
    <line x1="0" y1="490" x2="120" y2="490"/>
    <line x1="160" y1="490" x2="400" y2="490"/>
    <line x1="30" y1="514" x2="210" y2="514"/>
    <line x1="250" y1="514" x2="400" y2="514"/>
    <line x1="0" y1="540" x2="150" y2="540"/>
    <line x1="190" y1="540" x2="400" y2="540"/>
    <line x1="40" y1="566" x2="230" y2="566"/>
    <line x1="270" y1="566" x2="400" y2="566"/>
  </g>

  <!-- broad hull, wider than the sun so it reads as a boat, not a dome -->
  <path d="M 60 452 Q 200 500 340 452 L 300 430 Q 200 448 100 430 Z" fill="#E01B24"/>

  <!-- mast, clear of the sun above y=388 -->
  <rect x="195" y="120" width="10" height="320" fill="#E01B24"/>
  <circle cx="200" cy="116" r="7" fill="#E01B24"/>

  <!-- the ensign, part-way down for the night, clear against the sky -->
  <path d="M 205 190 L 271 190 L 253 212 L 271 234 L 205 234 Z" fill="#E01B24"/>
  <g stroke="#E01B24" stroke-width="6" stroke-linecap="round">
    <line x1="212" y1="150" x2="212" y2="165"/>
    <line x1="212" y1="125" x2="212" y2="140"/>
  </g>

  <!-- birds heading in for the night -->
  <path d="M 55 100 q 12 -12 24 0 q 12 -12 24 0" fill="none" stroke="#E01B24" stroke-width="6" stroke-linecap="round"/>
  <path d="M 300 70 q 10 -10 20 0 q 10 -10 20 0" fill="none" stroke="#E01B24" stroke-width="6" stroke-linecap="round"/>
</svg>

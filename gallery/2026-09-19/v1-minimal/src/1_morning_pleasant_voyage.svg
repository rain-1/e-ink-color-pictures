<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <!-- Morning colours: signal flags U-W hoisted at dawn, "I wish you a pleasant voyage". -->
  <rect x="0" y="0" width="400" height="600" fill="#123DB0"/>

  <!-- low dawn sun -->
  <circle cx="70" cy="470" r="46" fill="#FFFFFF"/>

  <!-- sea band -->
  <rect x="0" y="520" width="400" height="80" fill="#FFFFFF"/>
  <g stroke="#123DB0" stroke-width="6" stroke-linecap="round">
    <line x1="0" y1="538" x2="140" y2="538"/>
    <line x1="180" y1="538" x2="400" y2="538"/>
    <line x1="20" y1="558" x2="200" y2="558"/>
    <line x1="240" y1="558" x2="400" y2="558"/>
    <line x1="0" y1="578" x2="160" y2="578"/>
    <line x1="200" y1="578" x2="400" y2="578"/>
  </g>

  <!-- mast -->
  <rect x="190" y="70" width="14" height="470" fill="#FFFFFF"/>
  <!-- masthead pennant -->
  <path d="M 197 70 L 150 84 L 197 98 Z" fill="#E01B24"/>

  <!-- halyards -->
  <line x1="197" y1="130" x2="230" y2="150" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="197" y1="330" x2="230" y2="350" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Flag U: quartered red/white, red at upper hoist and lower fly -->
  <g transform="translate(230,130)">
    <rect x="0" y="0" width="160" height="110" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="0" y="0" width="80" height="55" fill="#E01B24"/>
    <rect x="80" y="55" width="80" height="55" fill="#E01B24"/>
  </g>

  <!-- Flag W: white field, blue border, red centre square -->
  <g transform="translate(230,330)">
    <rect x="0" y="0" width="160" height="110" fill="#123DB0" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="18" y="18" width="124" height="74" fill="#FFFFFF"/>
    <rect x="55" y="38" width="50" height="34" fill="#E01B24"/>
  </g>

  <!-- two gulls for scale -->
  <path d="M 60 160 q 14 -14 28 0 q 14 -14 28 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M 110 200 q 10 -10 20 0 q 10 -10 20 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</svg>
